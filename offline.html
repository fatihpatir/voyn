<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7C3AED" />
  <title>VOYN — Çevrimdışı</title>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .offline-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
      background: var(--bg-primary, #0F0F12);
      color: var(--text-primary, #FFFFFF);
    }
    .offline-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(124, 58, 237, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      color: #A78BFA;
    }
    .offline-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .offline-desc {
      font-size: 0.95rem;
      color: var(--text-secondary, #94A3B8);
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .retry-btn {
      padding: 0.75rem 1.75rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #7C3AED, #6D28D9);
      color: #FFFFFF;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
      transition: all 0.2s ease;
    }
    .retry-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1 class="offline-title">İnternet Bağlantısı Yok</h1>
    <p class="offline-desc">VOYN uygulamasını kullanabilmek için lütfen internet bağlantınızı kontrol edin. Daha önce alınan mesajlar cihazınızda saklanmaktadır.</p>
    <button class="retry-btn" onclick="window.location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
