<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5B21B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9D5FF5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="v-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.85);stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.3)" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg-grad)" />

  <!-- Subtle inner glow overlay -->
  <rect width="512" height="512" rx="112" ry="112"
    fill="none"
    stroke="rgba(255,255,255,0.15)"
    stroke-width="2" />

  <!-- "V" letter — bold, centered, modern -->
  <text
    x="256"
    y="348"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-size="280"
    font-weight="900"
    text-anchor="middle"
    fill="url(#v-grad)"
    filter="url(#shadow)"
    letter-spacing="-10"
  >V</text>
</svg>
